name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── 1. Deploy mini-app (server + client build on host) ────────────
      - name: Deploy mini-app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 82.198.229.155
          port: 65002
          username: u775839017
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 600s
          script: |
            export PATH=/opt/alt/alt-nodejs22/root/usr/bin:$PATH
            BASE=/home/u775839017/domains/app.persianatheists.com/nodejs

            cd $BASE
            git pull origin main

            cd $BASE/server
            npm install --production=false
            npm run build

            cd $BASE/client
            npm install
            npm run build

            touch $BASE/tmp/restart.txt
            echo "Deployed at $(date)"

      # ── 2. Deploy WP plugin via SCP ───────────────────────────────────
      - name: Deploy WP plugin
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 82.198.229.155
          port: 65002
          username: u775839017
          password: ${{ secrets.SSH_PASSWORD }}
          source: "wp-plugin/pa-youtube-sync/*"
          target: /home/u775839017/domains/persianatheists.com/public_html/wp-content/plugins/pa-youtube-sync
          strip_components: 2

      # ── 3. Deploy WP theme via SCP ────────────────────────────────────
      - name: Deploy WP theme
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 82.198.229.155
          port: 65002
          username: u775839017
          password: ${{ secrets.SSH_PASSWORD }}
          source: "wp-theme/*"
          target: /home/u775839017/domains/persianatheists.com/public_html/wp-content/themes/persian-atheists
          strip_components: 1
